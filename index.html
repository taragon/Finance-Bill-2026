<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <!-- Header Section -->
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Finance Bill 2026</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <!-- Welcome Message -->
        <p id="welcomeUser" style="text-align:right; font-weight:bold;"></p>

        <!-- Search -->
        <input type="text" id="searchInput" placeholder="Search tax type...">

        <!-- Table -->
        <table id="financeTable">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">Section</th>
                    <th onclick="sortTable(1)">Tax Type</th>
                    <th onclick="sortTable(2)">Old Rate</th>
                    <th onclick="sortTable(3)">New Rate</th>
                    <th>Description</th>
                    <th>Impact</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- ✅ Data is injected by JavaScript -->
            </tbody>
        </table>

    </div>

    <!-- JS -->
    <script src="js/app.js"></script>

</body>
</html>
